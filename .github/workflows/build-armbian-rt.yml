name: Build verified Orange Pi Zero PREEMPT_RT image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-armbian-rt.yml"
      - "userpatches/**"

permissions:
  contents: read

env:
  ARMBIAN_COMMIT: 43d7f8a43d8525aa3983c9d675a96dd2f99798f2
  KERNEL_VERSION: 6.18.37
  RT_RELEASE: rt6

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install build and verification dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl xz-utils qemu-system-arm qemu-utils \
            cpio file

      - name: Fetch pinned Armbian build framework
        run: |
          git clone https://github.com/armbian/build.git build
          git -C build checkout --detach "$ARMBIAN_COMMIT"
          cp userpatches/customize-image.sh build/userpatches/
          chmod +x build/userpatches/customize-image.sh

      - name: Add the exact official PREEMPT_RT patch and RT kernel config
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.18/patch-${KERNEL_VERSION}-${RT_RELEASE}.patch.xz" \
            --output /tmp/preempt-rt.patch.xz
          xz --test /tmp/preempt-rt.patch.xz
          mkdir -p build/userpatches/kernel/archive/sunxi-6.18
          xz --decompress --stdout /tmp/preempt-rt.patch.xz \
            > build/userpatches/kernel/archive/sunxi-6.18/0001-preempt-rt.patch
          test -s build/userpatches/kernel/archive/sunxi-6.18/0001-preempt-rt.patch

          cp build/config/kernel/linux-sunxi-current.config \
            build/userpatches/linux-sunxi-current.config
          config=build/userpatches/linux-sunxi-current.config
          sed -i \
            -e 's/^CONFIG_HZ_250=y$/# CONFIG_HZ_250 is not set\nCONFIG_HZ_1000=y\nCONFIG_HZ=1000/' \
            -e 's/^CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=y$/# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set\nCONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y/' \
            "$config"
          cat >> "$config" <<'EOF'
          # SamplerBox real-time profile.  The RT patch makes this choice available on ARMv7.
          CONFIG_EXPERT=y
          CONFIG_PREEMPT_RT=y
          CONFIG_HIGH_RES_TIMERS=y
          EOF
          grep -qx 'CONFIG_PREEMPT_RT=y' "$config"

      - name: Build Armbian image (fails if the RT patch does not apply)
        run: |
          cd build
          sudo ./compile.sh \
            BOARD=orangepizero \
            BRANCH=current \
            KERNELBRANCH=tag:v${KERNEL_VERSION} \
            RELEASE=bookworm \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL=make,debs,oldcache

      - name: Verify compiled PREEMPT_RT configuration
        run: |
          set -euxo pipefail
          image_deb=$(find build/output/debs -name 'linux-image*sunxi*.deb' -print -quit)
          test -n "$image_deb"
          rm -rf /tmp/kernel-package
          dpkg-deb -x "$image_deb" /tmp/kernel-package
          config=$(find /tmp/kernel-package/boot -name 'config-*' -print -quit)
          kernel=$(find /tmp/kernel-package/boot -type f \( -name 'vmlinuz-*' -o -name 'zImage-*' \) -print -quit)
          test -n "$config" && test -n "$kernel"
          grep -qx 'CONFIG_PREEMPT_RT=y' "$config"
          grep -qx 'CONFIG_HIGH_RES_TIMERS=y' "$config"
          grep -qx 'CONFIG_HZ_1000=y' "$config"
          grep -qx 'CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y' "$config"
          echo "KERNEL=$kernel" >> "$GITHUB_ENV"

      - name: Boot the built RT kernel on an Allwinner H3-class QEMU board
        run: |
          set -euxo pipefail
          dtb_deb=$(find build/output/debs -name 'linux-dtb*sunxi*.deb' -print -quit)
          test -n "$dtb_deb"
          rm -rf /tmp/dtb-package /tmp/initramfs
          dpkg-deb -x "$dtb_deb" /tmp/dtb-package
          dtb=$(find /tmp/dtb-package -name 'sun8i-h3-orangepi-pc.dtb' -print -quit)
          test -n "$dtb"
          mkdir -p /tmp/initramfs/{bin,proc,sys,dev}
          apt-get download busybox-static:armhf
          dpkg-deb -x busybox-static_*_armhf.deb /tmp/busybox-armhf
          cp /tmp/busybox-armhf/bin/busybox /tmp/initramfs/bin/busybox
          ln -s busybox /tmp/initramfs/bin/sh
          cat > /tmp/initramfs/init <<'EOF'
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          test "$(cat /sys/kernel/realtime)" = 1 || { echo RT_BOOT_FAILED; poweroff -f; }
          echo RT_BOOT_OK
          sleep 30
          echo RT_STABILITY_OK
          poweroff -f
          EOF
          chmod +x /tmp/initramfs/init
          (cd /tmp/initramfs && find . -print | cpio -o -H newc | gzip) > /tmp/initramfs.cpio.gz
          timeout 75 qemu-system-arm -M orangepi-pc -cpu cortex-a7 -m 512 -smp 4 \
            -kernel "$KERNEL" -dtb "$dtb" -initrd /tmp/initramfs.cpio.gz \
            -append 'console=ttyS0,115200 rdinit=/init' -nographic -no-reboot \
            > /tmp/qemu.log 2>&1 || true
          cat /tmp/qemu.log
          grep -qx 'RT_BOOT_OK' /tmp/qemu.log
          grep -qx 'RT_STABILITY_OK' /tmp/qemu.log

      - name: Upload ready-to-flash image
        uses: actions/upload-artifact@v4
        with:
          name: OrangePiZero-SamplerBox-RT-${{ env.KERNEL_VERSION }}-${{ env.RT_RELEASE }}
          path: build/output/images/*.img.xz
          compression-level: 0
          if-no-files-found: error

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: OrangePiZero-SamplerBox-RT-verification
          path: |
            /tmp/qemu.log
            build/output/debs/linux-*.deb
          compression-level: 0
          if-no-files-found: error
